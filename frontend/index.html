<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Task Manager</h1>

    <!-- Add Task -->
    <div class="task-form">
        <input type="text" id="title" placeholder="Enter task title">
        <input type="text" id="desc" placeholder="Enter description (optional)">
        <button onclick="addTask()">Add Task</button>
    </div>

    <!-- Task List -->
    <ul id="taskList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
